[project]
name = "opspilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bdpgmbv", email = "vyshalibdp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "langfuse>=5.2.0",
    "mcp>=2.3.0",
    "openai>=3.57.0",
    "opentelemetry-instrumentation-anthropic>=0.63.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
opspilot = "opspilot:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmark", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
